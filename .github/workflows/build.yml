name: Build GitPush APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust unit tests (host)
        run: cargo test --manifest-path rust/Cargo.toml --lib
        continue-on-error: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Point cargo-ndk at the preinstalled NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug + release APKs
        env:
          GP_CLIENT_ID: ${{ vars.GP_CLIENT_ID }}
        run: gradle --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: GitPush-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
