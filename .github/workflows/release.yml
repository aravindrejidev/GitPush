name: Release

# Run it by hand: Actions -> Release -> Run workflow, then type the version (for example 1.2.0).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, digits only: 1.2.0 (the tag becomes v1.2.0)"
        required: true
        type: string
      notes:
        description: "Release notes (leave empty to generate them from commits)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version number
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.0 (three numbers, no leading v)."
            exit 1
          fi
          IFS=. read -r MAJ MIN PAT <<< "$VERSION"
          if (( MIN > 999 || PAT > 999 || MAJ > 2000 )); then
            echo "::error::Minor and patch numbers must be 999 or lower."
            exit 1
          fi
          echo "VERSION_CODE=$(( MAJ * 1000000 + MIN * 1000 + PAT ))" >> "$GITHUB_ENV"
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. Pick a higher version."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Rust toolchain (Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Rust unit tests (host)
        run: cargo test --manifest-path rust/Cargo.toml --lib
        continue-on-error: true

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Point cargo-ndk at the preinstalled NDK
        run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build release APKs (arm64-v8a, armeabi-v7a, x86_64, universal)
        env:
          GP_CLIENT_ID: ${{ vars.GP_CLIENT_ID }}
          UPDATE_REPO: ${{ github.repository }}
        run: |
          gradle --no-daemon assembleRelease \
            -PVERSION_NAME="$VERSION" \
            -PVERSION_CODE="$VERSION_CODE"

      - name: Collect assets
        run: |
          mkdir -p dist
          shopt -s nullglob
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk)   # app-arm64-v8a-release
            abi=${n#app-}
            abi=${abi%-release}
            cp "$f" "dist/GitPush-v${VERSION}-${abi}.apk"
          done
          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo "::error::No APK files were produced."
            exit 1
          fi
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -la dist
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        run: |
          if [ -n "$NOTES" ]; then
            printf '%s\n' "$NOTES" > notes.md
            NOTES_ARGS=(--notes-file notes.md)
          else
            NOTES_ARGS=(--generate-notes)
          fi
          gh release create "v$VERSION" dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "GitPush v$VERSION" \
            --latest \
            "${NOTES_ARGS[@]}"

      - name: Summary
        run: |
          {
            echo "## GitPush v$VERSION"
            echo
            echo "| Phone | File |"
            echo "|---|---|"
            echo "| Most phones (64-bit ARM) | GitPush-v$VERSION-arm64-v8a.apk |"
            echo "| Older 32-bit ARM phones | GitPush-v$VERSION-armeabi-v7a.apk |"
            echo "| Emulators / x86_64 | GitPush-v$VERSION-x86_64.apk |"
            echo "| Not sure | GitPush-v$VERSION-universal.apk |"
          } >> "$GITHUB_STEP_SUMMARY"
